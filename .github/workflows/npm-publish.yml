# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://help.github.com/actions/language-and-framework-guides/publishing-nodejs-packages

name: Node.js Package

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm exec playwright install --with-deps
      - run: pnpm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    # Job-wide: the .npmrc that setup-node writes reads it, also during pnpm install. setup-node v7
    # no longer sets a placeholder when it is missing.
    env:
      NODE_AUTH_TOKEN: ${{secrets.npm_token}}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          scope: "@saehrimnir"
      - run: pnpm install
      # Publish a fresh Linux build rather than the committed dist/: declaration maps built on
      # Windows point to broken paths (rollup-plugin-dts bug).
      - run: pnpm build
      - run: pnpm publish --access public --no-git-checks

  publish-gpr:
    needs: build
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com/
          scope: "@saehm"
      - run: pnpm install
      # Publish a fresh Linux build rather than the committed dist/: declaration maps built on
      # Windows point to broken paths (rollup-plugin-dts bug).
      - run: pnpm build
      - run: pnpm publish --no-git-checks
